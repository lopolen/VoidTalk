<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої пости | VoidTalk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>
    <div class="floating-icons" id="floatingIcons" aria-hidden="true"></div>

    <header class="header">
        <a href="index.html" class="logo" id="logo">VoidTalk</a>

        <nav class="nav">
            <a href="messages.html">Повідомлення</a>
            <a href="my-posts.html" class="active-page">Мої пости</a>
            <a href="about.html">Про сайт</a>
            <a href="profile.html">Профіль</a>
        </nav>
    </header>

    <main class="main my-posts-main">
        <section class="my-posts-hero">
            <div>
                <div class="badge">Керування контентом</div>
                <h1>Мої пости</h1>
                <p id="myPostsSummary">Завантажуємо ваші публікації...</p>
            </div>

            <a href="messages.html" class="primary-btn">До стрічки</a>
        </section>

        <p class="form-status" id="myPostsStatus" aria-live="polite"></p>

        <section class="posts my-posts-list" id="myPostsList"></section>
    </main>

    <footer class="footer">
        <div class="stamp">
            <p>VoidTalk</p>
            <p>Ваші пости та керування ними</p>
        </div>
    </footer>

    <audio id="logoSound" src="audio/click-sound.mp3" preload="auto"></audio>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth-guard.js"></script>
    <script src="my-posts.js"></script>
</body>
</html>
